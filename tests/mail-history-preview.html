<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="../style.css"><title>Aperçu local — historique e-mails</title><body><main style="max-width:900px;margin:24px auto;padding:24px"><h1>Historique des échanges</h1><p>Démonstration locale · données fictives · aucun envoi</p><div id="demo"></div></main><script type="module">
import {mailHistoryMarkup,bindMailHistory} from '../mail-ui.mjs';
const sent=[{id:'one',actor_id:'demo',actor_name:'Jefferson Caudron',recipient:'contact@example.org',subject:'Une proposition pour votre établissement',body:'Bonjour, voici notre proposition de collaboration.',status:'sent',thread_id:'19aabbcc1234',created_at:'2026-10-16T10:00:00Z'},{id:'two',actor_id:'demo',actor_name:'Jefferson Caudron',recipient:'contact@example.org',subject:'Ancienne préparation à retirer',body:'Ancienne version non envoyée.',status:'prepared',created_at:'2026-10-16T09:00:00Z'}];
const store={user:{id:'demo'},mailHistory:async()=>({sent,received:[{subject:'Re: Une proposition pour votre établissement',sender:'contact@example.org',snippet:'Bonjour, merci pour votre proposition.',direction:'incoming',received_at:'2026-10-16T11:00:00Z',thread_id:'19aabbcc1234'}]}),mail:async(action,{id}={})=>{if(action==='sync')return {processed:1,checkedAt:new Date().toISOString()};sent.find(x=>x.id===id).status=action==='archive'?'archived':'prepared';}};
const dialog=document.querySelector('#demo');dialog.innerHTML=mailHistoryMarkup();await bindMailHistory({dialog,store,record:{brand_id:'demo',id:'demo'},canEdit:true});dialog.querySelectorAll('#mail-history > details').forEach(x=>x.open=true);
</script></body></html>
